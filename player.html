<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA Video Reference</title>
<style>
	:root {
		--bg: #0b0d1f; --panel: #12152c; --line: #262b4d; --fg: #e8eaf8; --muted: #9ba1c6;
		--accent: #3ec5ff; --accent2: #a78bfa; --ok: #4ade80; --warn: #fbbf24;
		color-scheme: dark;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		background: var(--bg); color: var(--fg);
		font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
		display: grid; grid-template-rows: auto 1fr auto;
	}
	header, footer {
		display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
		padding: 10px 14px; background: var(--panel); border-color: var(--line); border-style: solid; border-width: 0;
	}
	header { border-bottom-width: 1px; }
	footer { border-top-width: 1px; }
	h1 { font-size: 16px; margin: 0; font-weight: 700; }
	h1 span { color: var(--accent2); font-weight: 600; }
	.status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
	.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); }
	.dot.ok { background: var(--ok); }
	main { position: relative; display: grid; place-items: center; min-height: 0; overflow: hidden; }
	video { max-width: 100%; max-height: 100%; background: #000; display: none; }
	video.loaded { display: block; }
	video.mirror { transform: scaleX(-1); }
	.drop {
		border: 2px dashed var(--line); border-radius: 4px; padding: 40px 28px; text-align: center; color: var(--muted);
		max-width: 460px; margin: 16px;
	}
	.drop strong { color: var(--fg); display: block; font-size: 16px; margin-bottom: 6px; }
	main.dragging .drop, main.dragging { outline: 2px solid var(--accent); outline-offset: -6px; }
	button, .field {
		font: inherit; color: var(--fg); background: #181c38; border: 1px solid var(--line); border-radius: 4px;
		padding: 6px 12px; cursor: pointer;
	}
	button:hover { border-color: var(--accent); }
	button.on { border-color: var(--accent); color: var(--accent); }
	button.primary { background: var(--accent); color: #041226; border-color: var(--accent); font-weight: 600; }
	label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
	input[type=number] { width: 80px; font: inherit; color: var(--fg); background: #0e1126; border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; }
	.readout { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
	input[type=file] { display: none; }
</style>
</head>
<body>
<header>
	<h1>Heaven's Animator <span>Video Reference</span></h1>
	<div class="status"><div class="dot" id="dot"></div><span id="status">Waiting for Studio…</span></div>
</header>
<main id="stage">
	<div class="drop" id="drop">
		<strong>Drop a video here</strong>
		or press <em>Open Video…</em> below. It plays from your computer: nothing is uploaded.<br><br>
		In Studio: <em>HA Video Reference</em> tab › <em>Video Sync</em> › <em>Connect</em>. Then scrub or play in
		Heaven's Animator and this video follows.
	</div>
	<video id="video" playsinline muted preload="auto"></video>
</main>
<footer>
	<button class="primary" id="open">Open Video…</button>
	<input type="file" id="file" accept="video/*">
	<label>Frame offset <input type="number" id="offset" value="0" step="1" title="Studio frame 0 shows the video at this many frames in"></label>
	<button id="mirror" title="Flip the video left / right">Mirror</button>
	<button id="sound" title="Play the video's sound">Sound off</button>
	<button id="pip" title="A small always-on-top window you can put next to Studio">Picture in Picture</button>
	<span class="readout" id="readout"></span>
</footer>
<script>
	const video = document.getElementById("video");
	const drop = document.getElementById("drop");
	const stage = document.getElementById("stage");
	const offsetBox = document.getElementById("offset");
	const statusText = document.getElementById("status");
	const dot = document.getElementById("dot");
	const readout = document.getElementById("readout");
	const mirrorBtn = document.getElementById("mirror");
	const soundBtn = document.getElementById("sound");

	function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
	function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

	offsetBox.value = load("ha.offset", 0);
	let mirror = load("ha.mirror", false);
	function applyMirror() { video.classList.toggle("mirror", mirror); mirrorBtn.classList.toggle("on", mirror); }
	applyMirror();

	offsetBox.addEventListener("input", () => { save("ha.offset", Number(offsetBox.value) || 0); last = null; });
	mirrorBtn.addEventListener("click", () => { mirror = !mirror; save("ha.mirror", mirror); applyMirror(); });
	soundBtn.addEventListener("click", () => {
		video.muted = !video.muted;
		soundBtn.textContent = video.muted ? "Sound off" : "Sound on";
		soundBtn.classList.toggle("on", !video.muted);
	});
	document.getElementById("pip").addEventListener("click", async () => {
		try {
			if (document.pictureInPictureElement) await document.exitPictureInPicture();
			else if (video.src) await video.requestPictureInPicture();
		} catch (e) {}
	});

	// opening a video: the file picker or drag & drop (an object URL: the file never leaves this computer)
	function openFile(file) {
		if (!file) return;
		if (video.src) URL.revokeObjectURL(video.src);
		video.src = URL.createObjectURL(file);
		video.classList.add("loaded");
		drop.style.display = "none";
		document.title = file.name + " · HA Video Reference";
		last = null;
	}
	document.getElementById("open").addEventListener("click", () => document.getElementById("file").click());
	document.getElementById("file").addEventListener("change", (e) => openFile(e.target.files[0]));
	stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("dragging"); });
	stage.addEventListener("dragleave", () => stage.classList.remove("dragging"));
	stage.addEventListener("drop", (e) => {
		e.preventDefault();
		stage.classList.remove("dragging");
		openFile(e.dataTransfer.files[0]);
	});

	// sync: Studio's frame -> the video's time. Paused: seek to the exact frame. Playing: let the video play at
	// Studio's speed and only correct it when it drifts more than two frames.
	let last = null;
	function apply(s) {
		if (!video.src || !(s.fps > 0)) return;
		const offset = Number(offsetBox.value) || 0;
		let t = Math.max(0, (s.frame + offset) / s.fps);
		if (s.playing) {
			// the frame is a few ms old by now: add the time since Studio sent it
			if (s.age > 0 && s.age < 0.5) t += s.age * (s.speed || 1);
			if (video.playbackRate !== s.speed) video.playbackRate = s.speed || 1;
			if (video.paused) video.play().catch(() => {});
			if (Math.abs(video.currentTime - t) > 2 / s.fps) video.currentTime = t;
		} else {
			if (!video.paused) video.pause();
			if (Math.abs(video.currentTime - t) > 0.25 / s.fps) video.currentTime = t;
		}
		last = s;
	}

	function showStatus(s) {
		const live = s && s.age >= 0 && s.age < 3;
		dot.classList.toggle("ok", !!live);
		statusText.textContent = !s ? "The app stopped: start it again (Start Video Reference)"
			: live ? "Synced with Studio" : (s.age < 0 ? "Waiting for Studio… (Video Sync › Connect)" : "Studio went quiet");
		readout.textContent = s ? `Studio frame ${Math.round(s.frame)} · ${s.fps} fps` + (video.src ? ` · video ${video.currentTime.toFixed(2)} s` : "") : "";
	}

	async function poll() {
		let s = null;
		try {
			const r = await fetch("/state", { cache: "no-store" });
			s = await r.json();
			apply(s);
		} catch (e) {}
		showStatus(s);
		setTimeout(poll, 33);
	}
	poll();
</script>
</body>
</html>
